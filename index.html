<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오현주 - 자기소개</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: #ffffff;
      text-align: center;
      padding: 24px;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 56px 48px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      max-width: 640px;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 24px;
      line-height: 1.15;
    }

    .name {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      opacity: 0.9;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>안녕, 세상!</h1>
    <p class="name">저는 오현주입니다</p>
    <p class="tagline">만나서 반가워요. 반갑습니다!</p>
  </main>
</body>
</html>
